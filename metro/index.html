<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Metropolis — a sandbox city on the Moon</title>
<meta name="description" content="A SimCity 2000-style sandbox city builder on the Moon: sculpt crater terrain, chase the peaks of eternal light for power and the permanently shadowed floors for ice, run transit, power and atmosphere networks, and grow a city out of the regolith.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌗</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hud">
  <div class="brand">
    <span class="mark">🌗</span>
    <div>
      <strong>LUNAR METROPOLIS</strong>
      <small>A sandbox city on the Moon</small>
    </div>
  </div>
  <div class="chips" id="stats"></div>
  <div class="clockbox">
    <div class="speeds">
      <button data-speed="0" class="sp">❚❚</button>
      <button data-speed="1" class="sp on">1×</button>
      <button data-speed="4" class="sp">4×</button>
      <button data-speed="12" class="sp">12×</button>
    </div>
    <div class="modes">
      <button id="btnAuto" class="mode" title="Hand the city to the AI director. It lays the networks, zones to demand, keeps the grid and the air ahead of the city, and manages the budget — all with a bias toward growth.">🤖 Auto-play</button>
      <button id="btnSandbox" class="mode" title="Everything free, nothing locked. The city still advances through its eras as it grows — sandbox removes the price tag, not the progression.">∞ Sandbox</button>
      <button id="btnDisasters" class="mode" title="Meteor strikes, seal blowouts, dust surges and solar flares. Off by default. Nothing here can end a run.">☄ Disasters</button>
      <button id="btnInvasion" class="mode" title="A separate, sillier deck: flying saucers, tractor beams, crop circles and a chrome figure on a board who is entirely good news. Off by default, independent of Disasters.">👽 Invasion</button>
    </div>
    <div class="modes">
      <button id="btnCentre" class="mode" title="Recentre the camera on the middle of the map">Centre</button>
      <button id="btnNew" class="mode" title="Abandon this city and generate fresh terrain">New Colony</button>
    </div>
  </div>
</header>

<main>
  <nav class="palette" id="palette"></nav>

  <section class="stage">
    <div class="seg" id="viewBar">
      <button data-view="terrain" class="on">Terrain</button>
      <button data-view="height">Elevation</button>
      <button data-view="sun">Sunlight</button>
      <button data-view="transit">Transit</button>
      <button data-view="power">Power</button>
      <button data-view="air">Atmosphere</button>
      <button data-view="value">Land Value</button>
      <button data-view="dust">Dust</button>
      <button data-view="cov:safety">Repair</button>
      <button data-view="cov:health">Medical</button>
      <button data-view="cov:education">Training</button>
      <button data-view="cov:amenity">Amenity</button>
      <button data-view="deposits">Deposits</button>
    </div>
    <canvas id="cv"></canvas>
    <canvas id="mini" class="minimap" width="176" height="176"
            title="Minimap — click or drag to jump the camera. Press M for a bigger one."></canvas>
    <div class="statusbar"><span id="hint"></span></div>
  </section>

  <aside class="panel">
    <nav class="tabs">
      <button class="tab on" data-tab="info">City</button>
      <button class="tab" data-tab="budget">Budget</button>
      <button class="tab" data-tab="trends">Trends</button>
    </nav>
    <div class="tabpane on" id="pane-info">
      <h3 class="sec">Era</h3>
      <div id="era"></div>
      <div id="offer"></div>
      <h3 class="sec">Demand</h3>
      <div id="demand"></div>
      <div id="advisor"></div>
      <h3 class="sec">Selected ground</h3>
      <div id="tileDetail" class="empty">Click a tile to read the ground.</div>
      <h3 class="sec">City log</h3>
      <div id="log" class="empty">Nothing has happened yet.</div>
    </div>
    <div class="tabpane" id="pane-budget"></div>
    <div class="tabpane" id="pane-trends"></div>
  </aside>
</main>

<div class="modal" id="mapModal" hidden>
  <div class="sheet wide">
    <button class="xclose" id="mapClose" title="Close">✕</button>
    <h2>Colony map</h2>
    <p class="lede">Click or drag anywhere to move the camera there. The white box is what you
      are looking at now.</p>
    <canvas id="miniBig" width="560" height="560" class="minimap big"></canvas>
    <div class="sheetfoot"><button class="mode" id="mapDone">Close</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/terrain.js"></script>
<script src="js/grid.js"></script>
<script src="js/budget.js"></script>
<script src="js/services.js"></script>
<script src="js/eras.js"></script>
<script src="js/zones.js"></script>
<script src="js/disasters.js"></script>
<script src="js/invasion.js"></script>
<script src="js/sim.js"></script>
<script src="js/autopilot.js"></script>
<script src="js/agents.js"></script>
<script src="js/fx.js"></script>
<script src="js/minimap.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
