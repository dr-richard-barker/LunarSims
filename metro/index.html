<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Metropolis — a sandbox city on the Moon</title>
<meta name="description" content="A SimCity 2000-style sandbox city builder on the Moon: sculpt crater terrain, chase the peaks of eternal light for power and the permanently shadowed floors for ice, run transit, power and atmosphere networks, and grow a city out of the regolith.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌗</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hud">
  <div class="brand">
    <span class="mark">🌗</span>
    <div>
      <strong>LUNAR METROPOLIS</strong>
      <small>Sandbox city · Phase 2</small>
    </div>
  </div>
  <div class="chips" id="stats"></div>
  <div class="clockbox">
    <div class="speeds">
      <button data-speed="0" class="sp">❚❚</button>
      <button data-speed="1" class="sp on">1×</button>
      <button data-speed="4" class="sp">4×</button>
      <button data-speed="12" class="sp">12×</button>
    </div>
    <div class="modes">
      <button id="btnCentre" class="mode" title="Recentre the camera on the middle of the map">Centre</button>
      <button id="btnNew" class="mode" title="Abandon this city and generate fresh terrain">New Colony</button>
    </div>
  </div>
</header>

<main>
  <nav class="palette" id="palette"></nav>

  <section class="stage">
    <div class="seg" id="viewBar">
      <button data-view="terrain" class="on">Terrain</button>
      <button data-view="height">Elevation</button>
      <button data-view="sun">Sunlight</button>
      <button data-view="transit">Transit</button>
      <button data-view="power">Power</button>
      <button data-view="air">Atmosphere</button>
      <button data-view="value">Land Value</button>
      <button data-view="deposits">Deposits</button>
    </div>
    <canvas id="cv"></canvas>
    <div class="statusbar"><span id="hint"></span></div>
  </section>

  <aside class="panel">
    <nav class="tabs">
      <button class="tab on" data-tab="info">City</button>
      <button class="tab" data-tab="budget">Budget</button>
    </nav>
    <div class="tabpane on" id="pane-info">
      <h3 class="sec">Demand</h3>
      <div id="demand"></div>
      <div id="advisor"></div>
      <h3 class="sec">Selected ground</h3>
      <div id="tileDetail" class="empty">Click a tile to read the ground.</div>
    </div>
    <div class="tabpane" id="pane-budget"></div>
  </aside>
</main>

<div class="toast" id="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/terrain.js"></script>
<script src="js/grid.js"></script>
<script src="js/budget.js"></script>
<script src="js/zones.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
